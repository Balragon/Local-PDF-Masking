name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14          # Apple Silicon (M1 이후)
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow

      - name: Make .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/make_icns.py masker
          python scripts/make_icns.py excelpaster

      - name: Build
        run: |
          pyinstaller --noconfirm --clean pdfmasker.spec
          pyinstaller --noconfirm --clean excelpaster.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/PDF Masker.exe" "out/PDF-Masker-windows.exe"
          Copy-Item "dist/Excel Paster.exe" "out/Excel-Paster-windows.exe"

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmgroot
          # 서명 인증서가 없으므로 ad-hoc 서명 (Gatekeeper 경고는 README 참고)
          for app in "PDF Masker" "Excel Paster"; do
            codesign --force --deep --sign - "dist/$app.app"
            rm -rf dmgroot && mkdir dmgroot
            cp -R "dist/$app.app" dmgroot/
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname "$app" -srcfolder dmgroot -ov -format UDZO \
              "out/${app// /-}-${{ matrix.name }}.dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
