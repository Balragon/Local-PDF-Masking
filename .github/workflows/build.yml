name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_intel:
        description: "Intel Mac 빌드도 포함 (러너 수급이 적어 오래 걸릴 수 있음)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14          # Apple Silicon (M1 이후)
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow

      - name: Make .icns (macOS)
        if: runner.os == 'macOS'
        run: python scripts/make_icns.py

      - name: Build
        run: pyinstaller --noconfirm --clean pdfmasker.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/PDF Masker.exe" "out/PDF-Masker-windows.exe"

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmgroot
          # 서명 인증서가 없으므로 ad-hoc 서명 (Gatekeeper 경고는 README 참고)
          codesign --force --deep --sign - "dist/PDF Masker.app"
          cp -R "dist/PDF Masker.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "PDF Masker" -srcfolder dmgroot -ov -format UDZO \
            "out/PDF-Masker-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Masker-${{ matrix.name }}
          path: out/*

  # Intel Mac 은 GitHub 러너 공급이 매우 적어 기본 빌드에서 제외.
  # Actions 탭 → Run workflow → "Intel Mac 빌드도 포함" 체크 시 빌드됨.
  build-intel:
    if: github.event_name == 'workflow_dispatch' && inputs.build_intel
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: python scripts/make_icns.py
      - run: pyinstaller --noconfirm --clean pdfmasker.spec
      - run: |
          mkdir -p out dmgroot
          codesign --force --deep --sign - "dist/PDF Masker.app"
          cp -R "dist/PDF Masker.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "PDF Masker" -srcfolder dmgroot -ov -format UDZO out/PDF-Masker-macos-intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Masker-macos-intel
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
