name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14          # Apple Silicon (M1 이후)
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      # 러너 파이썬에 기본으로 깔린 certifi 등이 구버전일 수 있어 점검 전에 최신으로
      - run: pip install --upgrade certifi setuptools

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        shell: bash
        run: |
          # 번들에 들어가거나 빌드에 쓰이는 패키지 전체를 그대로 점검. 알려진 취약점이 있으면 빌드 실패
          python -m pip freeze > audit-requirements.txt
          pipx run pip-audit --no-deps --desc -r audit-requirements.txt

      - name: Make .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/make_icns.py masker
          python scripts/make_icns.py excelpaster

      - name: Build
        run: |
          pyinstaller --noconfirm --clean pdfmasker.spec
          pyinstaller --noconfirm --clean excelpaster.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "dist/PDF Masker.exe" "out/PDF-Masker-windows.exe"
          Copy-Item "dist/Excel Paster.exe" "out/Excel-Paster-windows.exe"
          # SHA-256 체크섬: 받은 파일이 CI 가 만든 그 파일인지 확인용
          Get-ChildItem out/*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out/SHA256SUMS-windows.txt

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmgroot
          # 서명 인증서가 없으므로 ad-hoc 서명 (Gatekeeper 경고는 README 참고)
          for app in "PDF Masker" "Excel Paster"; do
            codesign --force --deep --sign - "dist/$app.app"
            rm -rf dmgroot && mkdir dmgroot
            cp -R "dist/$app.app" dmgroot/
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname "$app" -srcfolder dmgroot -ov -format UDZO \
              "out/${app// /-}-${{ matrix.name }}.dmg"
          done
          (cd out && shasum -a 256 *.dmg > "SHA256SUMS-${{ matrix.name }}.txt")

      - name: Report sizes and checksums
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} 빌드 결과"
            echo
            echo '| 파일 | 크기 |'
            echo '| --- | --- |'
            for f in out/*.exe out/*.dmg; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo '```'
            cat out/SHA256SUMS-*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
